name: Schedule in Buffer

# The cloud routine commits queue/<date>/post.json; this schedules it in Buffer with the repo secret
# BUFFER_API_KEY (the cloud environment's Buffer key is not needed). Writes queue/<date>/buffer_id.txt back.
on:
  push:
    branches: [main]
    paths: ["queue/**/post.json"]
  schedule:
    - cron: "15 3 * * *"   # 06:15 KSA safety net, before the 09:00 post time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the cloud routine's default python3
      - name: Scripts compile on 3.11
        run: python -m py_compile scripts/*.py
      - name: Schedule pending posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/schedule_pending.py
      - name: Save ids
        if: always()
        run: |
          git config user.name "linkedin-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "buffer: scheduled $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Alert on failure
        if: failure()
        run: curl -s -H "Priority: high" -H "Title: LinkedIn: Buffer scheduling FAILED" -d "See GitHub Actions run ${{ github.run_id }} in linkedin-autopilot" "https://ntfy.sh/$(python -c "import json;print(json.load(open('config.json'))['ntfy_topic'])")"
